apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: food-delivery
    course.teko.ch/block: "06"
  name: rabbitmq
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  serviceName: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: food-delivery
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-credentials
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-credentials
        image: rabbitmq:4.3.5-management-alpine
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        name: rabbitmq
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          failureThreshold: 6
          initialDelaySeconds: 8
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: database-migrate
    app.kubernetes.io/part-of: food-delivery
    course.teko.ch/block: "06"
  name: database-migrate
  namespace: food-delivery
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migrate
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: database-url
        image: food-delivery-migrate:local
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 600
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/part-of: food-delivery
    course.teko.ch/block: "06"
  name: food-delivery
  namespace: food-delivery
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: control-api
            port:
              number: 8080
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: control-api
            port:
              number: 8080
        path: /health
        pathType: Prefix
      - backend:
          service:
            name: control-api
            port:
              number: 8080
        path: /metrics
        pathType: Prefix
      - backend:
          service:
            name: dashboard
            port:
              number: 3000
        path: /
        pathType: Prefix
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: food-delivery
    course.teko.ch/block: "06"
  name: food-delivery-db
  namespace: food-delivery
spec:
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: delivery
      owner: delivery
      secret:
        name: food-delivery-db-credentials
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: false
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 192Mi
  storage:
    size: 1Gi
    storageClass: local-path
