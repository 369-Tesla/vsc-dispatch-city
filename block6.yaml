apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: control-api
    app.kubernetes.io/part-of: food-delivery
    course.teko.ch/block: "06"
  name: control-api
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-api
        app.kubernetes.io/part-of: food-delivery
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: database-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: rabbitmq-credentials
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: simulation-config
        image: food-delivery-control-api:local
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        name: control-api
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 96Mi
          requests:
            cpu: 25m
            memory: 24Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
