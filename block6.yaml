        name: dashboard
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 48Mi
